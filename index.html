<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>free drum kits — drumkitty</title>
  <meta name="description" content="Free drum kits and sample libraries. No license required.">
  <link rel="canonical" href="https://drumkitty.com/">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "drumkitty",
      "url": "https://drumkitty.com/"
    }
  </script>
  <link rel="icon" href="assets/drumkitty.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="has-hero">
  <!-- header:start -->
  <svg class="noise-filter" aria-hidden="true">
    <filter id="kits-noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </svg>
  <header class="masthead">
    <a class="brand" href="/">
      <img class="brand__mark" src="assets/drumkitty.png" alt="">
      <span class="brand__name">drumkitty</span>
    </a>

  </header>

  <!-- header:end -->

  <main class="page">
    <section class="hero">
      <img class="hero__img" src="assets/hero-untitled-40.png" alt="Two people in a dim, crowded room.">

      <div class="hero__copy">
        <h1 class="hero__title">free drum kits</h1>
      </div>

    </section>

    <section class="kits">
      <figure class="kits__noise" aria-hidden="true"></figure>
      <ul class="kits__grid">
        <!-- kits:start -->
        <li class="kit-card kit-card--featured">
          <a class="kit-card__link" href="kits/2016.html">
            <span class="kit-card__label">Featured kit</span>
            <img class="kit-card__art" src="assets/kit-2016.webp" alt="2016 emo rap drum kit cover art">
            <span class="kit-card__name">2016</span>
            <span class="kit-card__genre">emo rap</span>
          </a>
        </li>
        <li class="kit-card">
          <a class="kit-card__link" href="kits/2am.html">
            <img class="kit-card__art" src="assets/kit-2am.webp" alt="2AM rnb rap drum kit cover art">
            <span class="kit-card__name">2AM</span>
            <span class="kit-card__genre">rnb rap</span>
          </a>
        </li>
        <li class="kit-card">
          <a class="kit-card__link" href="kits/halo.html">
            <img class="kit-card__art" src="assets/kit-halo.webp" alt="Halo pluggnb drum kit cover art">
            <span class="kit-card__name">Halo</span>
            <span class="kit-card__genre">pluggnb</span>
          </a>
        </li>
        <li class="kit-card">
          <a class="kit-card__link" href="kits/bando.html">
            <img class="kit-card__art" src="assets/kit-bando.webp" alt="Bando trap drum kit cover art">
            <span class="kit-card__name">Bando</span>
            <span class="kit-card__genre">trap</span>
          </a>
        </li>
        <li class="kit-card">
          <a class="kit-card__link" href="kits/redline.html">
            <img class="kit-card__art" src="assets/kit-redline.png" alt="Redline rage trap drum kit cover art">
            <span class="kit-card__name">Redline</span>
            <span class="kit-card__genre">rage trap</span>
          </a>
        </li>
        <li class="kit-card">
          <a class="kit-card__link" href="kits/drift.html">
            <img class="kit-card__art" src="assets/kit-drift.jpg" alt="Drift ambient chill drum kit cover art">
            <span class="kit-card__name">Drift</span>
            <span class="kit-card__genre">ambient chill</span>
          </a>
        </li>
        <li class="kit-card">
          <a class="kit-card__link" href="kits/slide.html">
            <img class="kit-card__art" src="assets/kit-slide.png" alt="Slide drill drum kit cover art">
            <span class="kit-card__name">Slide</span>
            <span class="kit-card__genre">drill</span>
          </a>
        </li>
        <!-- kits:end -->
      </ul>
    </section>
  </main>
  <!-- footer:start -->
  <footer class="site-footer">
    <a class="site-footer__brand" href="/" aria-label="drumkitty home">
      <img class="site-footer__mark" src="assets/drumkitty.png" alt="">
      <span class="site-footer__name">drumkitty</span>
    </a>
    <p class="site-footer__note">all kits are free — no license required</p>
  </footer>
  <!-- footer:end -->
</body>
</html>
